name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Configurar GitHub Pages (solo cuando se va a desplegar)
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # 4. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 5. Ejecutar pruebas unitarias (una sola vez, sin watch)
      - name: Run Unit Tests
        run: npm test -- --watch=false

      # 6. Generar build de Angular
      - name: Build Angular
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # 7. Fallback SPA para rutas sin hash (OBLIGATORIO en App 2, Path Location)
      - name: Configure GitHub Pages fallback
        run: cp ./dist/lab-pipelines-path/browser/index.html ./dist/lab-pipelines-path/browser/404.html

      # 8. Subir artefacto generado
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/lab-pipelines-path/browser

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verificar despliegue
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar la app y una ruta interna
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          echo "Verificando $URL"
          for i in $(seq 1 10); do
            HOME_STATUS=$(curl -s -o home.html -w "%{http_code}" "$URL")
            ROUTE_STATUS=$(curl -s -o route.html -w "%{http_code}" "${URL}proyectos")
            echo "Intento $i -> inicio: $HOME_STATUS, /proyectos: $ROUTE_STATUS"
            # La raíz debe responder 200; la ruta interna la sirve 404.html (estado 404), pero debe contener la app
            if [ "$HOME_STATUS" = "200" ] && grep -q "<app-root" home.html && grep -q "<app-root" route.html; then
              echo "✅ La app y el fallback de rutas internas funcionan"
              exit 0
            fi
            sleep 10
          done
          echo "❌ La app no respondió correctamente"
          exit 1
